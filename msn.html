			<section class="page-section">
				<h2>项目介绍</h2>
				<p>这是一款基于 Unity 2D 开发的横版闯关游戏。</p>
				<p>使用 Unity 2D 动画组件设计角色动画。</p>
				<p>使用瓦片地图搭建游戏场景。</p>
				<p>使用预制体实现发射子弹的效果。</p>
				<p>用 C# 编写脚本实现角色攻击和怪物逻辑。</p>
				<p>采用协程设置 BOSS 属性，让 BOSS 能够间隔一段时间后发动攻击。</p>
				<p>用数组管理角色和 BOSS，当数组中的单位消失时进行胜负判断。</p>
				<p>负责界面设计、关卡设计、代码编写、动画设计等。</p>
			</section>
